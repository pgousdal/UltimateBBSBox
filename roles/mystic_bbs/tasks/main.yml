---
- name: Install runtime dependencies (Mystic ships mostly-static, but these help)
  ansible.builtin.apt:
    name:
      - libc6
      - ca-certificates
      - unzip
      - tar
    state: present

- name: Create mystic group
  ansible.builtin.group:
    name: "{{ mystic_group }}"
    state: present

- name: Create mystic service user
  ansible.builtin.user:
    name: "{{ mystic_user }}"
    group: "{{ mystic_group }}"
    home: "{{ mystic_home }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Mystic BBS directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mystic_user }}"
    group: "{{ mystic_group }}"
    mode: "0750"
  loop:
    - "{{ mystic_home }}"
    - "{{ mystic_doors_dir }}"
    - "{{ mystic_home }}/data"
    - "{{ mystic_home }}/text"
    - "{{ mystic_home }}/logs"

- name: Check if Mystic BBS binary is already installed
  ansible.builtin.stat:
    path: "{{ mystic_home }}/mis"
  register: mystic_binary

- name: Check if preservation-first Mystic binary is installed
  ansible.builtin.stat:
    path: "{{ mystic_home }}/software/current/mis"
  register: mystic_integration_binary

- name: Pause clean installation until the M7.1 workflow has installed Mystic
  ansible.builtin.assert:
    that:
      - mystic_binary.stat.exists or mystic_integration_binary.stat.exists
    fail_msg: >-
      Host prerequisites are ready. Acquire and install Mystic through
      scripts/ubb-integration.py, which verifies the M1 object and preserves
      living state, then rerun this play. Direct network installation is forbidden.

- name: Select legacy or preservation-first Mystic runtime directory
  ansible.builtin.set_fact:
    mystic_runtime_home: "{{ mystic_home if mystic_binary.stat.exists else mystic_home + '/software/current' }}"

- name: Ensure Mystic binaries are executable
  ansible.builtin.file:
    path: "{{ mystic_runtime_home }}/{{ item }}"
    mode: "0750"
    owner: "{{ mystic_user }}"
    group: "{{ mystic_group }}"
  loop:
    - mis
    - mudit
    - mishttp
  ignore_errors: true  # not every release ships every binary

# --- Doors ------------------------------------------------------
- name: Deploy .mpy door packages
  ansible.builtin.copy:
    src: "mystic_doors/{{ item.src }}/"
    dest: "{{ mystic_doors_dir }}/{{ item.name }}/"
    owner: "{{ mystic_user }}"
    group: "{{ mystic_group }}"
    mode: "0750"
  loop: "{{ mystic_doors }}"
  loop_control:
    label: "{{ item.name }}"

# --- systemd service ----------------------------------------------
- name: Deploy systemd unit for Mystic BBS
  ansible.builtin.template:
    src: mystic-bbs.service.j2
    dest: /etc/systemd/system/mystic-bbs.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart mystic-bbs
  when: mystic_manage_legacy_systemd | bool

- name: Enable and start Mystic BBS service
  ansible.builtin.systemd:
    name: mystic-bbs.service
    enabled: true
    state: started
    daemon_reload: true
  when: mystic_manage_legacy_systemd | bool

- name: Print first-run reminder
  ansible.builtin.debug:
    msg: >-
      Mystic BBS binaries are deployed from a verified preservation object.
      Initial BBS configuration (message bases, menus, door registration in
      MIS) is interactive - log in as {{ mystic_user }} and run
      '{{ mystic_runtime_home }}/mis -cfg' once to complete first-time setup, then
      use the UBB supervisor. Set mystic_manage_legacy_systemd=true only during
      migration when the M3 supervisor is not yet the lifecycle owner.
