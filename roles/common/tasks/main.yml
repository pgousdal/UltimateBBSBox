---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present

- name: Enable unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
  when: unattended_upgrades_enabled

# --- SSH hardening --------------------------------------------------
- name: Configure sshd
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/99-bbs-box.conf
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: restart sshd

- name: Disable root SSH login (fallback safety net)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ 'yes' if allow_root_login else 'no' }}"
  notify: restart sshd

# --- ufw base rules (detailed opening happens in network_gateway) --
- name: Ensure ufw default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Ensure ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp

- name: Enable ufw
  community.general.ufw:
    state: enabled
