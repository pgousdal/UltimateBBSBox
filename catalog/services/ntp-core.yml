kind: service
schema_version: 1
id: ntp-core
service:
  type: infrastructure
  title: UBB NTP Core
  description: Local chrony-compatible time synchronization service.
  family: ntp
  tags: [infrastructure, network]
endpoint: ntp-core
exposure:
  main_menu: false
  via_bbs: []
  admin_only: true
access:
  direct_allowed: false
lifecycle:
  mode: always_on
  sharing: multiuser
  startup_timeout_seconds: 30
  restart: on_failure
  shutdown_policy: manual
