kind: integration
schema_version: 1
id: integration-mystic-linux-example
target: bbs-mystic-example
integration_revision: 1
automation_level: assisted
runtime: native
installation:
  steps:
    - type: acquire
    - type: verify
    - type: automated
      action: deploy-binaries
    - type: manual
      instruction: Complete first-time Mystic configuration using MIS.
      evidence_required:
        - version_screen
        - configured_message_base
qualification:
  checks:
    - boots
    - ready
    - login
    - menu
    - clean_shutdown
